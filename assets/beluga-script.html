<script>
(function () {
  // Survey estimates: [year, estimate, low 95%, high 95%, 1 = earlier method]. Full table: data/beluga-series.csv
  var EST = {ci: [[1979,1293,null,null,2],[1994,653,null,null,1],[1995,491,null,null,1],[1996,594,null,null,1],[1997,440,null,null,1],[1998,347,null,null,1],[1999,367,null,null,1],[2000,435,null,null,1],[2001,386,null,null,1],[2002,313,null,null,1],[2003,357,null,null,1],[2004,238,208,280,0],[2005,285,249,329,0],[2006,268,229,318,0],[2007,358,315,416,0],[2008,283,261,318,0],[2009,342,301,389,0],[2010,415,353,489,0],[2012,336,306,373,0],[2014,379,337,426,0],[2016,247,217,287,0],[2018,269,227,333,0],[2021,361,176,919,0],[2022,381,317,473,0]], whb: [[1987,31124,20178,48008,0],[2004,51761,28759,93159,0],[2015,54473,44988,65957,0]], ehb: [[1985,4497,2725,7420,0],[1993,2504,1211,5178,0],[2001,2634,1150,6035,0],[2004,5069,2687,9564,0],[2008,4326,1294,14465,0],[2011,4681,2049,10694,0],[2015,8506,3313,21840,0],[2021,2858,1653,4941,0],[2024,1491,900,2400,0]]};
  // [year, value]: Arctic sea ice in September (million km2), global ocean temperature vs 1901-2000 (degrees C)
  var ICE = [[1979,7.05],[1980,7.67],[1981,7.14],[1982,7.3],[1983,7.39],[1984,6.81],[1985,6.7],[1986,7.41],[1987,7.28],[1988,7.37],[1989,7.01],[1990,6.14],[1991,6.47],[1992,7.47],[1993,6.4],[1994,7.14],[1995,6.08],[1996,7.58],[1997,6.69],[1998,6.54],[1999,6.12],[2000,6.25],[2001,6.73],[2002,5.83],[2003,6.12],[2004,5.98],[2005,5.5],[2006,5.86],[2007,4.27],[2008,4.69],[2009,5.26],[2010,4.87],[2011,4.56],[2012,3.57],[2013,5.21],[2014,5.22],[2015,4.62],[2016,4.53],[2017,4.82],[2018,4.79],[2019,4.36],[2020,4.0],[2021,4.95],[2022,4.9],[2023,4.38],[2024,4.35],[2025,4.75],[2026,4.81]], SST = [[1975,-0.04],[1976,0.01],[1977,0.2],[1978,0.15],[1979,0.26],[1980,0.26],[1981,0.23],[1982,0.22],[1983,0.29],[1984,0.19],[1985,0.17],[1986,0.22],[1987,0.36],[1988,0.31],[1989,0.25],[1990,0.33],[1991,0.32],[1992,0.25],[1993,0.25],[1994,0.29],[1995,0.32],[1996,0.31],[1997,0.46],[1998,0.5],[1999,0.3],[2000,0.33],[2001,0.43],[2002,0.45],[2003,0.47],[2004,0.46],[2005,0.46],[2006,0.46],[2007,0.38],[2008,0.37],[2009,0.51],[2010,0.51],[2011,0.41],[2012,0.46],[2013,0.5],[2014,0.59],[2015,0.69],[2016,0.73],[2017,0.7],[2018,0.66],[2019,0.76],[2020,0.73],[2021,0.63],[2022,0.68],[2023,0.9],[2024,0.95],[2025,0.83]];
  var Y0 = 1975, Y1 = 2026, svg = document.getElementById("plot"), NS = "http://www.w3.org/2000/svg";
  function el(n, at, p) { var e = document.createElementNS(NS, n); for (var k in at) e.setAttribute(k, at[k]); (p||svg).appendChild(e); return e; }
  var W = 600, L = 8, R = 8, P1 = [22, 178], P2 = [232, 352], H = 384;
  function X(y) { return L + (y-Y0)/(Y1-Y0)*(W-L-R); }
  function YY(p, f) { f = Math.min(Math.max(f, 0), 1); return p[1] - f*(p[1]-p[0]); }
  [P1, P2].forEach(function (p) { [0, .5, 1].forEach(function (f) { el("line", {class:"grid", x1:L, x2:W-R, y1:YY(p,f), y2:YY(p,f)}); }); });
  el("text", {class:"panel", x:L, y:P1[0]-8}).textContent = "Belugas, each against its own highest estimate";
  el("text", {class:"panel", x:L, y:P2[0]-8}).textContent = "Sea ice and ocean temperature";
  [1975,2000,2026].forEach(function (y) { var t = el("text", {class:"tick", x:X(y), y:H-6, "text-anchor": y===Y0 ? "start" : y===Y1 ? "end" : "middle"}); t.textContent = y; });
  var cursor = el("line", {class:"cursor", y1:P1[0], y2:P2[1]});
  // Beluga estimates: dots with ranges, joined by a faint line within each survey method.
  var GROUPS = [{k:"ci", cls:"s1", dx:0, v:"v0"}, {k:"whb", cls:"s2", dx:-3, v:"v1"}, {k:"ehb", cls:"s3", dx:3, v:"v2"}];
  GROUPS.forEach(function (g) {
    var rows = EST[g.k]; g.max = 1.25*Math.max.apply(null, rows.map(function (r) { return r[1]; }));
    g.join = el("path", {class:"join "+g.cls});
    g.items = rows.map(function (r) {
      var e = el("g", {class:"est "+g.cls+(r[4] ? " alt" : "")}), x = X(r[0]) + g.dx;
      if (r[2] !== null) el("line", {class:"ci", x1:x, x2:x, y1:YY(P1, r[2]/g.max), y2:YY(P1, r[3]/g.max)}, e);
      el("circle", {class:"ept", cx:x, cy:YY(P1, r[1]/g.max), r:4.5}, e);
      return {r:r, e:e, x:x, y:YY(P1, r[1]/g.max)};
    });
  });
  var imin = 0, imax = Math.max.apply(null, ICE.map(function (r) { return r[1]; }));
  var smin = Math.min.apply(null, SST.map(function (r) { return r[1]; })), smax = Math.max.apply(null, SST.map(function (r) { return r[1]; }));
  var LINES = [{d:ICE, cls:"s4", f:function (v) { return v/imax; }, v:"v3", fmt:function (v) { return v.toFixed(2); }},
               {d:SST, cls:"s5", f:function (v) { return .08 + .92*(v-smin)/(smax-smin); }, v:"v4", fmt:function (v) { return (v > 0 ? "+" : v < 0 ? "−" : "") + Math.abs(v).toFixed(2) + " °C"; }}];
  LINES.forEach(function (l) { l.path = el("path", {class:"line "+l.cls}); });
  var slider = document.getElementById("slider"), yr = document.getElementById("year");
  function fmt(n) { return n.toLocaleString("en-US"); }
  function setStat(id, txt, lab) {
    var n = document.getElementById(id); n.textContent = txt || (lab ? "No estimate yet" : "No data");
    n.parentNode.classList.toggle("missing", !txt);
    if (lab !== undefined) document.getElementById(id+"y").textContent = lab;
  }
  function draw(year) {
    yr.textContent = year;
    cursor.setAttribute("x1", X(year)); cursor.setAttribute("x2", X(year));
    GROUPS.forEach(function (g) {
      var d = "", prev = null, last = null;
      g.items.forEach(function (it) {
        var on = it.r[0] <= year; it.e.style.display = on ? "" : "none";
        if (!on) return;
        d += (prev !== null && prev === it.r[4] ? "L" : "M") + it.x.toFixed(1) + " " + it.y.toFixed(1);
        prev = it.r[4]; last = it.r;
      });
      g.join.setAttribute("d", d);
      var base = document.getElementById(g.v+"y").dataset.base;
      setStat(g.v, last ? fmt(last[1]) : "", last ? base + ", counted " + last[0] : base);
    });
    LINES.forEach(function (l) {
      var d = "", at = null;
      l.d.forEach(function (r) {
        if (r[0] > year) return;
        d += (d ? "L" : "M") + X(r[0]).toFixed(1) + " " + YY(P2, l.f(r[1])).toFixed(1);
        if (r[0] === year) at = r[1];
      });
      l.path.setAttribute("d", d);
      setStat(l.v, at === null ? "" : l.fmt(at));
    });
  }
  slider.addEventListener("input", function () { stop(); draw(+slider.value); });
  var timer = null, sw = document.getElementById("sweep");
  function stop() { if (timer) { clearInterval(timer); timer = null; sw.innerHTML = "&#9654;"; sw.setAttribute("aria-label","Play timeline"); } }
  sw.addEventListener("click", function () {
    if (timer) return stop();
    if (+slider.value >= Y1) slider.value = Y0;
    draw(+slider.value); sw.innerHTML = "&#10074;&#10074;"; sw.setAttribute("aria-label","Pause timeline");
    timer = setInterval(function () {
      if (+slider.value >= Y1) return stop();
      slider.value = +slider.value + 1; draw(+slider.value);
    }, 170);
  });
  draw(+slider.value);

  // The solid graphic wipes in from the left while the call itself is sounding.
  var a = document.getElementById("audio"), call = document.getElementById("call"),
      top = document.getElementById("call-top"), hint = document.getElementById("call-hint"), raf;
  var C0 = +a.dataset.start, C1 = +a.dataset.end, HINT = hint.textContent;
  function wipe(p) { top.style.clipPath = "inset(0 " + (100 - p * 100) + "% 0 0)"; }
  function tick() {
    wipe(Math.min(Math.max((a.currentTime - C0) / (C1 - C0), 0), 1));
    if (!a.paused && !a.ended) raf = requestAnimationFrame(tick);
  }
  function reset() {
    cancelAnimationFrame(raf); call.classList.remove("active");
    call.setAttribute("aria-pressed", "false"); top.style.clipPath = ""; hint.textContent = HINT;
  }
  call.addEventListener("click", function () {
    if (!a.paused) { a.pause(); hint.textContent = "Paused. Tap to continue"; return; }
    if (a.ended || !call.classList.contains("active")) { a.currentTime = 0; wipe(0); }
    call.classList.add("active"); call.setAttribute("aria-pressed", "true");
    hint.textContent = "Listening";
    var pr = a.play();
    if (pr && pr.catch) pr.catch(function () { reset(); hint.textContent = "The sound could not play"; });
  });
  a.addEventListener("play", function () { cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); });
  a.addEventListener("ended", reset);
})();
</script>
