<script>
(function () {
  var SERIES = [[1975,null,1104450,null],[1976,71,1188963,null],[1977,80,1064157,null],[1978,80,1181130,null],[1979,82,1054922,null],[1980,84,987816,null],[1981,82,873460,null],[1982,79,693140,null],[1983,76,728613,null],[1984,74,908422,null],[1985,77,729076,null],[1986,81,671934,null],[1987,84,529009,null],[1988,85,510361,null],[1989,85,599647,null],[1990,88,553794,null],[1991,92,411366,null],[1992,91,391961,null],[1993,97,338622,4940],[1994,96,246063,5523],[1995,98,233920,5320],[1996,97,261441,5159],[1997,93,218737,5134],[1998,89,123878,4645],[1999,85,192163,4966],[2000,82,161738,4688],[2001,78,234263,4851],[2002,79,233123,4655],[2003,82,180085,4705],[2004,83,182226,4521],[2005,88,203559,4828],[2006,89,237041,4570],[2007,86,270492,4208],[2008,85,230959,4506],[2009,85,196165,4133],[2010,86,207343,4177],[2011,87,232388,4582],[2012,84,264376,5009],[2013,82,255694,5124],[2014,78,185354,4827],[2015,81,222441,4855],[2016,83,187612,4909],[2017,77,300084,5032],[2018,75,292915,5011],[2019,73,224981,4980],[2020,72,135670,4326],[2021,74,205955,4476],[2022,73,229526,4840],[2023,75,247901,4681],[2024,73,220529,4788],[2025,74,260538,4728],[2026,76,null,null]];
  // [year, whales, Chinook landed, ship entries]. Full table: data/orca-series.csv
  var LINES = [
    {i:1, unit:"whales",        cls:"s1"},
    {i:2, unit:"Chinook caught",cls:"s2"},
    {i:3, unit:"cargo and passenger ship entries", cls:"s3"}
  ];
  var svg = document.getElementById("plot"), NS = "http://www.w3.org/2000/svg";
  function el(n, at, parent) { var e = document.createElementNS(NS, n); for (var k in at) e.setAttribute(k, at[k]); (parent||svg).appendChild(e); return e; }
  var W = 600, H = 300, L = 8, R = 8, T = 12, B = 30, Y0 = 1975, Y1 = 2026;
  function X(y) { return L + (y-Y0)/(Y1-Y0)*(W-L-R); }
  function YY(f) { return H-B - f*(H-B-T); }
  [0, .5, 1].forEach(function (f) { el("line", {class:"grid", x1:L, x2:W-R, y1:YY(f), y2:YY(f)}); });
  [1975,1990,2005,2026].forEach(function (y) { var t = el("text", {class:"tick", x:X(y), y:H-8, "text-anchor": y===1975 ? "start" : y===2026 ? "end" : "middle"}); t.textContent = y; });
  var cursor = el("line", {class:"cursor", y1:T, y2:H-B});
  LINES.forEach(function (l) {
    l.max = Math.max.apply(null, SERIES.map(function (r) { return r[l.i] || 0; }));
    l.path = el("path", {class:"line "+l.cls});
    l.dot = el("circle", {class:"pt "+l.cls, r:4.5});
    l.node = document.getElementById("v"+l.i);
  });
  var slider = document.getElementById("slider"), yr = document.getElementById("year");
  function fmt(n) { return n.toLocaleString("en-US"); }
  function draw(year) {
    yr.textContent = year;
    cursor.setAttribute("x1", X(year)); cursor.setAttribute("x2", X(year));
    LINES.forEach(function (l) {
      var d = "", last = null, atYear = null;
      SERIES.forEach(function (r) {
        if (r[0] > year || r[l.i] === null) return;
        d += (d ? "L" : "M") + X(r[0]).toFixed(1) + " " + YY(r[l.i]/l.max).toFixed(1);
        last = r; if (r[0] === year) atYear = r[l.i];
      });
      l.path.setAttribute("d", d);
      if (last) { l.dot.setAttribute("cx", X(last[0])); l.dot.setAttribute("cy", YY(last[l.i]/l.max)); l.dot.style.display = ""; }
      else l.dot.style.display = "none";
      l.node.textContent = atYear === null ? "No data" : fmt(atYear);
      l.node.parentNode.classList.toggle("missing", atYear === null);
    });
  }
  slider.addEventListener("input", function () { stop(); draw(+slider.value); });
  var timer = null, sw = document.getElementById("sweep");
  function stop() { if (timer) { clearInterval(timer); timer = null; sw.innerHTML = "&#9654;"; sw.setAttribute("aria-label","Play timeline"); } }
  sw.addEventListener("click", function () {
    if (timer) return stop();
    if (+slider.value >= Y1) slider.value = Y0;
    draw(+slider.value); sw.innerHTML = "&#10074;&#10074;"; sw.setAttribute("aria-label","Pause timeline");
    timer = setInterval(function () {
      if (+slider.value >= Y1) return stop();
      slider.value = +slider.value + 1; draw(+slider.value);
    }, 170);
  });
  draw(2025);

  // The solid graphic wipes in from the left over the length of the clip.
  var a = document.getElementById("audio"), call = document.getElementById("call"),
      top = document.getElementById("call-top"), hint = document.getElementById("call-hint"), raf;
  function wipe(p) { top.style.clipPath = "inset(0 " + (100 - p * 100) + "% 0 0)"; }
  function tick() {
    if (a.duration) wipe(Math.min(a.currentTime / a.duration, 1));
    if (!a.paused && !a.ended) raf = requestAnimationFrame(tick);
  }
  function reset() {
    cancelAnimationFrame(raf); call.classList.remove("active");
    call.setAttribute("aria-pressed", "false"); top.style.clipPath = "";
    hint.textContent = "Tap the call to hear it";
  }
  call.addEventListener("click", function () {
    if (!a.paused) { a.pause(); hint.textContent = "Paused. Tap to continue"; return; }
    if (a.ended || !call.classList.contains("active")) { a.currentTime = 0; wipe(0); }
    call.classList.add("active"); call.setAttribute("aria-pressed", "true");
    hint.textContent = "Listening";
    var pr = a.play();
    if (pr && pr.catch) pr.catch(function () { reset(); hint.textContent = "The sound could not play"; });
  });
  a.addEventListener("play", function () { cancelAnimationFrame(raf); raf = requestAnimationFrame(tick); });
  a.addEventListener("ended", reset);
})();
</script>
