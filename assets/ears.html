<script>
(function () {
  // Paste your Google Apps Script web app URL here once it's deployed.
  var API = "";
  var box = document.querySelector(".ears"); if (!box) return;
  var animal = box.dataset.animal, input = box.querySelector("#ears-key"),
      opts = box.querySelectorAll(".ears-opt"), msg = box.querySelector(".ears-msg");
  if (window.EARS_API_OVERRIDE) API = window.EARS_API_OVERRIDE;
  function norm(v) { v = v.toUpperCase().replace(/[^A-Z0-9]/g, "").slice(0, 8); return v.length > 4 ? v.slice(0,4) + "-" + v.slice(4) : v; }
  function valid() { return /^[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(input.value); }
  function show(t) {
    var total = (t.E||0)+(t.A||0)+(t.R||0)+(t.S||0);
    ["E","A","R","S"].forEach(function (k) {
      box.querySelector('.ears-pct[data-k="'+k+'"]').textContent = total ? Math.round(100*(t[k]||0)/total) + "%" : "";
    });
    box.classList.toggle("has-votes", total > 0);
  }
  function setEnabled(on) { opts.forEach(function (b) { b.disabled = !on || !API; }); }
  input.addEventListener("input", function () {
    var p = input.selectionStart, before = input.value.length;
    input.value = norm(input.value);
    setEnabled(valid());
    msg.textContent = valid() ? "Now choose where your share goes." : "";
  });
  box.querySelector("form").addEventListener("submit", function (e) { e.preventDefault(); });
  opts.forEach(function (b) {
    b.addEventListener("click", function () {
      if (!valid() || !API) return;
      setEnabled(false); msg.textContent = "Saving your vote";
      fetch(API, {method: "POST", headers: {"Content-Type": "text/plain;charset=utf-8"},
        body: JSON.stringify({code: input.value, animal: animal, choice: b.dataset.choice})})
        .then(function (r) { return r.json(); })
        .then(function (d) {
          if (!d.ok) { msg.textContent = d.error || "That didn't work. Please try again."; setEnabled(valid()); return; }
          opts.forEach(function (o) { o.classList.toggle("chosen", o === b); o.setAttribute("aria-pressed", o === b); });
          msg.textContent = d.updated ? "Your vote is updated. Thank you." : "Thank you, your vote is counted.";
          show(d.tallies); setEnabled(true);
        })
        .catch(function () { msg.textContent = "We couldn't reach the vote counter. Please try again later."; setEnabled(valid()); });
    });
  });
  if (!API) { input.disabled = true; msg.textContent = "Voting opens soon."; return; }
  fetch(API + "?animal=" + encodeURIComponent(animal)).then(function (r) { return r.json(); })
    .then(function (d) { if (d.ok) show(d.tallies); }).catch(function () {});
})();
</script>
